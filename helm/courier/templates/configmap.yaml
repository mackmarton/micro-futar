apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "courier.fullname" . }}-config
  labels:
    {{- include "courier.labels" . | nindent 4 }}
data:
  DATASOURCE_URL: {{ .Values.config.datasource.url | quote }}
  DATASOURCE_USERNAME: {{ .Values.config.datasource.username | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.kafka.bootstrapServers | quote }}
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  SPRING_PROFILE: {{ .Values.config.springProfile | quote }}
  KEYCLOAK_URL: {{ .Values.config.keycloak.url | quote }}
  PACKAGE_SIZE_TOPIC: {{ .Values.kafka.topics.package_size_topic | quote }}
  SHIPMENT_TOPIC: {{ .Values.kafka.topics.shipment_topic | quote }}
  SHIPMENT_ROUTE_COURIER_TOPIC: {{ .Values.kafka.topics.shipment_route_courier_topic | quote }}
  DEPO_TOPIC: {{ .Values.kafka.topics.depo_topic | quote }}
  SHIPMENT_ROUTE_TOPIC: {{ .Values.kafka.topics.shipment_route_topic | quote }}
  COURIER_TOPIC: {{ .Values.kafka.topics.courier_topic | quote }}
  VEHICLE_TOPIC: {{ .Values.kafka.topics.vehicle_topic | quote }}
