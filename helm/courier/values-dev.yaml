replicaCount: 1

image:
  repository: ghcr.io/mackmarton/courier
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: github-auth

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

autoscaling:
  enabled: false

config:
  serverPort: 8080
  springProfile: dev
  datasource:
    url: jdbc:postgresql://postgres-db-postgresql.micro-futar-services-dev:5432/courier_db
    username: courier_db
    passwordSecretName: courier-db-secret-dev
    passwordSecretKey: PASSWORD
  kafka:
    bootstrapServers: kafka-futar.micro-futar-services-dev:9092
  keycloak:
    url: http://keycloak.micro-futar-services-dev:80/auth

kafka:
  topics:
    package_size_topic: package-sizes
    shipment_topic: shipments
    shipment_route_courier_topic: shipment-route-couriers
    depo_topic: depos
    shipment_route_topic: shipment-routes
    courier_topic: couriers
    vehicle_topic: vehicles