replicaCount: 1

image:
  repository: ghcr.io/mackmarton/orders
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
    - name: github-auth

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

config:
  serverPort: 8080
  springProfile: dev
  datasource:
    url: jdbc:postgresql://postgres-db-postgresql.micro-futar-services-dev:5432/orders_db
    username: orders_db
    passwordSecretName: orders-db-secret-dev
    passwordSecretKey: PASSWORD
  kafka:
    bootstrapServers: kafka-futar.micro-futar-services-dev:9092
  keycloak:
    url: http://keycloak-dev:8080

