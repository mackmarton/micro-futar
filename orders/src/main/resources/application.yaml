server:
  port: ${SERVER_PORT}

spring:
  application:
    name: orders
  profiles:
    active: ${SPRING_PROFILE}
  jpa:
    generate-ddl: true
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL}/realms/micro-futar-realm/protocol/openid-connect/certs
          #issuer-uri: ${KEYCLOAK_URL}/realms/orders
jwt:
  auth:
    converter:
      resource-id: api-gateway-client
      principal-attribute: preferred_username
kafka:
  topics:
    location-region-topic: ${LOCATION_REGION_TOPIC}
    location-country-topic: ${LOCATION_COUNTRY_TOPIC}
    location-city-topic: ${LOCATION_CITY_TOPIC}
    country-price-topic: ${COUNTRY_PRICE_TOPIC}
    package-size-topic: ${PACKAGE_SIZE_TOPIC}
    shipment-topic: ${SHIPMENT_TOPIC}

url:
  api-gateway: ${API_GATEWAY_URL}:http://localhost:8085