server:
  port: ${SERVER_PORT}

spring:
  application:
    name: orders
  profiles:
    active: ${SPRING_PROFILE}
  jpa:
    generate-ddl: false
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/realms/Orders
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
jwt:
  auth:
    converter:
      resource-id: orders-client
      principal-attribute: preferred_username
kafka:
  topics:
    location-region-topic: ${LOCATION_REGION_TOPIC}
    location-country-topic: ${LOCATION_COUNTRY_TOPIC}
    location-city-topic: ${LOCATION_CITY_TOPIC}
    country-price-topic: ${COUNTRY_PRICE_TOPIC}
    package-size-topic: ${PACKAGE_SIZE_TOPIC}
    order-topic: ${ORDER_TOPIC}