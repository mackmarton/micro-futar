replicaCount: 1

image:
  repository: tracking
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

config:
  serverPort: 8080
  springProfile: dev
  datasource:
    url: jdbc:postgresql://postgres-dev:5432/tracking_db
    username: tracking_db
    passwordSecretName: tracking-db-secret
    passwordSecretKey: password
  kafka:
    bootstrapServers: kafka-dev:9092
  keycloak:
    url: http://keycloak-dev:8080

