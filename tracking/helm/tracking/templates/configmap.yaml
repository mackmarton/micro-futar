apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracking.fullname" . }}-config
  labels:
    {{- include "tracking.labels" . | nindent 4 }}
data:
  DATASOURCE_URL: {{ .Values.config.datasource.url | quote }}
  DATASOURCE_USERNAME: {{ .Values.config.datasource.username | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.kafka.bootstrapServers | quote }}
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  SPRING_PROFILE: {{ .Values.config.springProfile | quote }}
  KEYCLOAK_URL: {{ .Values.config.keycloak.url | quote }}

