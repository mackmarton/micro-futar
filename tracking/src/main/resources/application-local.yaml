spring:
  jpa:
    generate-ddl: true
  # Defaults to a local Mailpit (docker compose), env vars still override.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_ENABLED:false}
kafka:
  topics:
    shipment-topic: shipments
    shipment-notification-topic: shipment-notifications
    depo-topic: depos
    shipment-route-topic: shipment-routes
    location-country-topic: location-countries
    location-city-topic: location-cities
notification:
  tracking-page-url: ${TRACKING_PAGE_URL:http://localhost:5173/portal/tracking}
  mail:
    from: ${MAIL_FROM:noreply@micro-futar.hu}
