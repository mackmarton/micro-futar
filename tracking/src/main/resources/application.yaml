server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Would open an SMTP connection on every health check.
    mail:
      enabled: false

spring:
  application:
    name: tracking
  profiles:
    active: ${SPRING_PROFILE}
  jpa:
    generate-ddl: true
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH}
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

kafka:
  topics:
    shipment-topic: ${SHIPMENT_TOPIC}
    shipment-notification-topic: ${SHIPMENT_NOTIFICATION_TOPIC}
    depo-topic: ${DEPO_TOPIC}
    shipment-route-topic: ${SHIPMENT_ROUTE_TOPIC}
    location-country-topic: ${LOCATION_COUNTRY_TOPIC}
    location-city-topic: ${LOCATION_CITY_TOPIC}

notification:
  tracking-page-url: ${TRACKING_PAGE_URL}
  mail:
    from: ${MAIL_FROM}
    from-name: Micro-futár
  sender:
    poll-interval-ms: 10000
    batch-size: 20
    max-attempts: 8

url:
  api-gateway: ${API_GATEWAY_URL:http://localhost:8085}