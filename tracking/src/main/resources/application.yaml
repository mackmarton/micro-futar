server:
  port: ${SERVER_PORT}

spring:
  application:
    name: tracking
  profiles:
    active: ${SPRING_PROFILE}
  jpa:
    generate-ddl: false
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

kafka:
  topics:
    shipment-topic: ${SHIPMENT_TOPIC}
    depo-topic: ${DEPO_TOPIC}
    shipment-route-topic: ${SHIPMENT_ROUTE_TOPIC}
    location-country-topic: ${LOCATION_COUNTRY_TOPIC}
    location-city-topic: ${LOCATION_CITY_TOPIC}