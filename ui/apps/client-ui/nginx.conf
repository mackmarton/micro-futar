server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A docker-entrypoint.d/20-write-app-env.sh a konténer indulásakor írja
    # felül ezt a fájlt a tényleges env változókkal, ezért nem szabad
    # cache-elni a böngészőben.
    location = /app-env.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # A Next build a /_next/static alatti fájlokat tartalom-hash-es névvel
    # generálja, így ezek korlátlan ideig cache-elhetők.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Next.js statikus export: minden oldal előre renderelt HTML-ként van a
    # build kimenetben (pl. /portal/tracking -> portal/tracking.html).
    # Ismeretlen útvonalra a valódi 404-es oldal megy, 404-es státusszal (SEO).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
