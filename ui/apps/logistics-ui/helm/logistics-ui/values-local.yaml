replicaCount: 1

image:
  repository: logistics-ui
  pullPolicy: Never
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi

autoscaling:
  enabled: false

config:
  viteApiBaseUrl: http://localhost:8085
