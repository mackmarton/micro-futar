server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A docker-entrypoint.d/20-write-app-env.sh a konténer indulásakor írja
    # felül ezt a fájlt a tényleges env változókkal, ezért nem szabad
    # cache-elni a böngészőben.
    location = /app-env.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # A PWA service worker-t (vite-plugin-pwa, autoUpdate) sem szabad
    # cache-elni, különben a felhasználók beragadhatnak egy régi verzióba.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: a React Router kliens-oldali route-jaihoz is az
    # index.html-t kell visszaadni, nem 404-et.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
