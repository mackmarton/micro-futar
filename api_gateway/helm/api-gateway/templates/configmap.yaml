apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}-config
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  MANAGEMENT_PORT: {{ .Values.config.managementPort | quote }}
  SPRING_PROFILE: {{ .Values.config.springProfile | quote }}
  KEYCLOAK_URL: {{ .Values.config.keycloak.url | quote }}
  REDIS_HOST: {{ .Values.config.redis.host | quote }}
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  COOKIE_DOMAIN: {{ .Values.config.cookie.domain | quote }}
  COOKIE_SECURE: {{ .Values.config.cookie.secure | quote }}
  DEFAULT_REDIRECT_URL: {{ .Values.config.defaultRedirectUrl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  REDIRECT_ALLOWED_SCHEMES: {{ .Values.config.redirect.allowedSchemes | quote }}
  REDIRECT_ALLOWED_HOSTS: {{ .Values.config.redirect.allowedHosts | quote }}
  REDIRECT_ALLOWED_DOMAIN_SUFFIXES: {{ .Values.config.redirect.allowedDomainSuffixes | quote }}
  ORDER_SERVICE_URI: {{ .Values.config.services.order | quote }}
  TRACKING_SERVICE_URI: {{ .Values.config.services.tracking | quote }}
  LOGISTICS_SERVICE_URI: {{ .Values.config.services.logistics | quote }}
  COURIER_SERVICE_URI: {{ .Values.config.services.courier | quote }}
  PAYMENT_SERVICE_URI: {{ .Values.config.services.payment | quote }}
  RATE_LIMIT_TRUSTED_PROXY_COUNT: {{ .Values.config.rateLimit.trustedProxyCount | quote }}
  RATE_LIMIT_REDIS_TIMEOUT: {{ .Values.config.rateLimit.redisTimeout | quote }}
  RATE_LIMIT_SHIPMENT_CREATE_REPLENISH_RATE: {{ .Values.config.rateLimit.shipmentCreate.replenishRate | quote }}
  RATE_LIMIT_SHIPMENT_CREATE_BURST_CAPACITY: {{ .Values.config.rateLimit.shipmentCreate.burstCapacity | quote }}
  RATE_LIMIT_SHIPMENT_CREATE_REQUESTED_TOKENS: {{ .Values.config.rateLimit.shipmentCreate.requestedTokens | quote }}
  RATE_LIMIT_CHECKOUT_REPLENISH_RATE: {{ .Values.config.rateLimit.checkout.replenishRate | quote }}
  RATE_LIMIT_CHECKOUT_BURST_CAPACITY: {{ .Values.config.rateLimit.checkout.burstCapacity | quote }}
  RATE_LIMIT_CHECKOUT_REQUESTED_TOKENS: {{ .Values.config.rateLimit.checkout.requestedTokens | quote }}
  RATE_LIMIT_TRACKING_REPLENISH_RATE: {{ .Values.config.rateLimit.tracking.replenishRate | quote }}
  RATE_LIMIT_TRACKING_BURST_CAPACITY: {{ .Values.config.rateLimit.tracking.burstCapacity | quote }}
  RATE_LIMIT_TRACKING_REQUESTED_TOKENS: {{ .Values.config.rateLimit.tracking.requestedTokens | quote }}
  RATE_LIMIT_DEFAULT_REPLENISH_RATE: {{ .Values.config.rateLimit.default.replenishRate | quote }}
  RATE_LIMIT_DEFAULT_BURST_CAPACITY: {{ .Values.config.rateLimit.default.burstCapacity | quote }}
  RATE_LIMIT_DEFAULT_REQUESTED_TOKENS: {{ .Values.config.rateLimit.default.requestedTokens | quote }}
