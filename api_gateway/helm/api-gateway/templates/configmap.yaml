apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}-config
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  SPRING_PROFILE: {{ .Values.config.springProfile | quote }}
  KEYCLOAK_URL: {{ .Values.config.keycloak.url | quote }}
  REDIS_HOST: {{ .Values.config.redis.host | quote }}
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  COOKIE_DOMAIN: {{ .Values.config.cookie.domain | quote }}
  COOKIE_SECURE: {{ .Values.config.cookie.secure | quote }}
  DEFAULT_REDIRECT_URL: {{ .Values.config.defaultRedirectUrl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  ORDER_SERVICE_URI: {{ .Values.config.services.order | quote }}
  TRACKING_SERVICE_URI: {{ .Values.config.services.tracking | quote }}
  LOGISTICS_SERVICE_URI: {{ .Values.config.services.logistics | quote }}
  COURIER_SERVICE_URI: {{ .Values.config.services.courier | quote }}
