server:
  port: ${SERVER_PORT}
  reactive:
    session:
      cookie:
        domain: ${COOKIE_DOMAIN}
        same-site: lax
        secure: ${COOKIE_SECURE}

# Külön porton fut, amely nincs benne a Kubernetes Service-ben, így kívülről (Traefik) nem érhető el.
# A liveness és readiness csoport szándékosan nem függ külső rendszertől (Redis, Keycloak).
management:
  server:
    port: ${MANAGEMENT_PORT:8087}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILE}
  session:
    store-type: redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URL}/realms/micro-futar-realm
        registration:
          keycloak:
            provider: keycloak
            client-id: api-gateway-client
            client-secret: ${CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid, profile, email, offline_access
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - TokenRelay
          routes:
            # A sorrend számít: a szűkebb route-ok előbb állnak, az első illeszkedő nyer.
            - id: shipment-create
              uri: ${ORDER_SERVICE_URI}
              predicates:
                - Path=/api/orders/shipments/new
                - Method=POST
              filters:
                - RewritePath=/api/orders/(?<segment>.*), /api/$\{segment}
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    redis-rate-limiter.replenishRate: ${app.rate-limit.shipment-create.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${app.rate-limit.shipment-create.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${app.rate-limit.shipment-create.requested-tokens}
            - id: payment-checkout
              uri: ${PAYMENT_SERVICE_URI}
              predicates:
                - Path=/api/payments/checkout
                - Method=POST
              filters:
                - RewritePath=/api/payments/(?<segment>.*), /api/$\{segment}
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    redis-rate-limiter.replenishRate: ${app.rate-limit.checkout.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${app.rate-limit.checkout.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${app.rate-limit.checkout.requested-tokens}
            # Stripe webhook: szándékosan nincs rate limit (aláírás védi, és a Stripe újraküld).
            - id: stripe-webhook
              uri: ${PAYMENT_SERVICE_URI}
              predicates:
                - Path=/api/payments/webhooks/stripe
              filters:
                - RewritePath=/api/payments/(?<segment>.*), /api/$\{segment}
            - id: order-service
              uri: ${ORDER_SERVICE_URI}
              predicates:
                - Path=/api/orders/**
              filters:
                - RewritePath=/api/orders/(?<segment>.*), /api/$\{segment}
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    redis-rate-limiter.replenishRate: ${app.rate-limit.default.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${app.rate-limit.default.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${app.rate-limit.default.requested-tokens}
            - id: tracking-service
              uri: ${TRACKING_SERVICE_URI}
              predicates:
                - Path=/api/tracking/**
              filters:
                - RewritePath=/api/tracking/(?<segment>.*), /api/$\{segment}
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    redis-rate-limiter.replenishRate: ${app.rate-limit.tracking.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${app.rate-limit.tracking.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${app.rate-limit.tracking.requested-tokens}
            - id: logistics-service
              uri: ${LOGISTICS_SERVICE_URI}
              predicates:
                - Path=/api/logistics/**
              filters:
                - RewritePath=/api/logistics/(?<segment>.*), /api/$\{segment}
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    redis-rate-limiter.replenishRate: ${app.rate-limit.default.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${app.rate-limit.default.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${app.rate-limit.default.requested-tokens}
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI}
              predicates:
                - Path=/api/payments/**
              filters:
                - RewritePath=/api/payments/(?<segment>.*), /api/$\{segment}
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    redis-rate-limiter.replenishRate: ${app.rate-limit.default.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${app.rate-limit.default.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${app.rate-limit.default.requested-tokens}
            - id: courier-service
              uri: ${COURIER_SERVICE_URI}
              predicates:
                - Path=/api/courier/**
              filters:
                - RewritePath=/api/courier/(?<segment>.*), /api/$\{segment}
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    redis-rate-limiter.replenishRate: ${app.rate-limit.default.replenish-rate}
                    redis-rate-limiter.burstCapacity: ${app.rate-limit.default.burst-capacity}
                    redis-rate-limiter.requestedTokens: ${app.rate-limit.default.requested-tokens}

app:
  default-redirect-url: ${DEFAULT_REDIRECT_URL}
  redirect:
    allowed-schemes: ${REDIRECT_ALLOWED_SCHEMES:}
    allowed-hosts: ${REDIRECT_ALLOWED_HOSTS:}
    allowed-domain-suffixes: ${REDIRECT_ALLOWED_DOMAIN_SUFFIXES:}
  csrf:
    header-name: ${CSRF_HEADER_NAME:X-Requested-With}
    header-value: ${CSRF_HEADER_VALUE:micro-futar}
    exempt-paths: ${CSRF_EXEMPT_PATHS:/api/payments/webhooks/stripe}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  rate-limit:
    # Ennyi megbízható proxy fűz az X-Forwarded-For fejléchez; 0 = nincs proxy, a közvetlen távoli cím számít.
    trusted-proxy-count: ${RATE_LIMIT_TRUSTED_PROXY_COUNT:0}
    # Ha a Redis ennyi idő alatt nem válaszol, a kérés korlátozás nélkül átmegy.
    redis-timeout: ${RATE_LIMIT_REDIS_TIMEOUT:200ms}
    # Tartós ráta = replenish-rate / requested-tokens kérés/s, löket = burst-capacity / requested-tokens kérés.
    shipment-create: # 5/perc, löket 10
      replenish-rate: ${RATE_LIMIT_SHIPMENT_CREATE_REPLENISH_RATE:1}
      burst-capacity: ${RATE_LIMIT_SHIPMENT_CREATE_BURST_CAPACITY:120}
      requested-tokens: ${RATE_LIMIT_SHIPMENT_CREATE_REQUESTED_TOKENS:12}
    checkout: # 10/perc, löket 10
      replenish-rate: ${RATE_LIMIT_CHECKOUT_REPLENISH_RATE:1}
      burst-capacity: ${RATE_LIMIT_CHECKOUT_BURST_CAPACITY:60}
      requested-tokens: ${RATE_LIMIT_CHECKOUT_REQUESTED_TOKENS:6}
    tracking: # 2/s, löket 20
      replenish-rate: ${RATE_LIMIT_TRACKING_REPLENISH_RATE:2}
      burst-capacity: ${RATE_LIMIT_TRACKING_BURST_CAPACITY:20}
      requested-tokens: ${RATE_LIMIT_TRACKING_REQUESTED_TOKENS:1}
    default: # 20/s, löket 60
      replenish-rate: ${RATE_LIMIT_DEFAULT_REPLENISH_RATE:20}
      burst-capacity: ${RATE_LIMIT_DEFAULT_BURST_CAPACITY:60}
      requested-tokens: ${RATE_LIMIT_DEFAULT_REQUESTED_TOKENS:1}
