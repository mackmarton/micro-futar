apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: courier-updater
spec:
  namespace: argocd
  writeBackConfig:
    method: "argocd"
  applicationRefs:
    - namePattern: "courier"
      images:
        - alias: "courier"
          imageName: "ghcr.io/mackmarton/courier"
          manifestTargets:
            helm:
              name: "ghcr.io/mackmarton/courier"
              tag: "image.tag"
          commonUpdateSettings:
            updateStrategy: "newest-build"
            pullSecret: "pullsecret:argocd/ghcr-login-secret"
    - namePattern: "logistics"
      images:
        - alias: "logistics"
          imageName: "ghcr.io/mackmarton/logistics"
          manifestTargets:
            helm:
              name: "ghcr.io/mackmarton/logistics"
              tag: "image.tag"
          commonUpdateSettings:
            updateStrategy: "newest-build"
            pullSecret: "pullsecret:argocd/ghcr-login-secret"
    - namePattern: "orders"
      images:
        - alias: "orders"
          imageName: "ghcr.io/mackmarton/orders"
          manifestTargets:
            helm:
              name: "ghcr.io/mackmarton/orders"
              tag: "image.tag"
          commonUpdateSettings:
            updateStrategy: "newest-build"
            pullSecret: "pullsecret:argocd/ghcr-login-secret"

  