providers:
  kubernetesCRD:
    enabled: true
  # Kell a cert-manager HTTP-01 challenge-jéhez: az ACME validáció idejére
  # cert-manager egy sima Ingress objektumot hoz létre (nem IngressRoute
  # CRD-t), ezt csak így látja meg a Traefik.
  kubernetesIngress:
    enabled: true

ports:
  web:
    expose:
      default: true
  websecure:
    expose:
      default: true

# A k3s beépített ServiceLB-je LoadBalancer type mellett közvetlenül a node
# 80/443-as portjára köt be, ez a publikus Hetzner VPS-en kell (NodePort
# 30080/30443 egy otthoni/port-forwardolt clusterre való volt).
service:
  type: LoadBalancer
