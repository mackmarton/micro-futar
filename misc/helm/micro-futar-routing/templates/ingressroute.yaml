{{- range .Values.routes }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .name }}-route
  namespace: {{ .namespace }}
spec:
  entryPoints:
    - {{ $.Values.entryPoint }}
  routes:
    - match: Host(`{{ .host }}`)
      kind: Rule
      services:
        - name: {{ .service }}
          port: {{ .port }}
      {{- if .middlewares }}
      middlewares:
        {{- range .middlewares }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
  {{- if $.Values.tls.enabled }}
  {{- if $.Values.tls.secretName }}
  tls:
    secretName: {{ $.Values.tls.secretName }}
  {{- else }}
  tls: {}
  {{- end }}
  {{- end }}
{{- end }}
