# A dev környezet nincs publikusan kitéve, csak `kubectl port-forward`-on
# keresztül érhető el (lásd misc/port-fw.sh: svc/traefik 8070:80). Ez a chart
# itt csak akkor hasznos, ha valaki a teljes aldomain-routingot akarja
# helyben tesztelni a Traefiken keresztül: a *.localhost hostnevek modern
# böngészőkben/OS-eken automatikusan 127.0.0.1-re oldódnak fel, /etc/hosts
# módosítás nélkül. A mindennapi fejlesztéshez viszont a port-fw.sh-ban lévő,
# service-enkénti közvetlen port-forward az elsődleges út, nem ez a chart.
entryPoint: web

tls:
  enabled: false
  secretName: ""

routes:
  - name: client-ui
    host: localhost
    service: client-ui
    port: 80
    namespace: micro-futar-apps-dev
  - name: logistics-ui
    host: admin.localhost
    service: logistics-ui
    port: 80
    namespace: micro-futar-apps-dev
  - name: courier-ui
    host: futar.localhost
    service: courier-ui
    port: 80
    namespace: micro-futar-apps-dev
  - name: api-gateway
    host: api.localhost
    service: api-gateway
    port: 8080
    namespace: micro-futar-apps-dev
  - name: keycloak
    host: auth.localhost
    service: keycloak
    port: 80
    namespace: micro-futar-services-dev
