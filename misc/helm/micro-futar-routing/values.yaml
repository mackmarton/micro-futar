entryPoint: web

tls:
  enabled: false
  secretName: ""

routes:
  - name: client-ui
    host: localhost
    service: client-ui
    port: 80
    namespace: micro-futar-apps
  - name: logistics-ui
    host: admin.localhost
    service: logistics-ui
    port: 80
    namespace: micro-futar-apps
  - name: courier-ui
    host: futar.localhost
    service: courier-ui
    port: 80
    namespace: micro-futar-apps
  - name: api-gateway
    host: api.localhost
    service: api-gateway
    port: 8080
    namespace: micro-futar-apps
  - name: keycloak
    host: auth.localhost
    service: keycloak
    port: 80
    namespace: micro-futar-services
