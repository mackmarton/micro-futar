global:
  security:
    allowInsecureImages: true

image:
  repository: bitnamilegacy/redis
  registry: docker.io
  tag: 8.0.3-debian-12-r3
  digest: ""

# Csak az api_gateway session-tárolójaként használjuk: nem kell HA/cluster,
# egyetlen master instance elég. Ha elvész, a felhasználók újra bejelentkeznek.
architecture: standalone

auth:
  enabled: true
  existingSecret: redis-auth-secret
  existingSecretPasswordKey: REDIS_PASSWORD

master:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

replica:
  replicaCount: 0
