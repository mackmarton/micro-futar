# helm repo add external-secrets https://charts.external-secrets.io
# Argo CD Application: repo https://charts.external-secrets.io, chart "external-secrets"
#
# A serviceAccount.name explicit "external-secrets"-re állítva, mert a Vault
# kubernetes auth role-ja (eso-role) erre a névre és az "external-secrets"
# namespace-re van korlátozva (bound_service_account_names/namespaces).

serviceAccount:
  create: true
  name: "external-secrets"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
