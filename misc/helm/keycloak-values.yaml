global:
  security:
    allowInsecureImages: true

# A saját image-ünk a bitnamilegacy/keycloak:26.3.3-debian-12-r0 alapján, beégetve a
# Keycloakify-jal buildelt egyedi login/account témát (ui/apps/keycloak-theme).
# Lásd: ui/apps/keycloak-theme/Dockerfile, .github/workflows/ci-keycloak-theme.yml
image:
  repository: mackmarton/keycloak
  registry: ghcr.io
  tag: latest
  digest: ""
  pullSecrets:
    - github-auth

auth:
  adminUser: admin
  existingSecret: "keycloak-secrets"
  passwordSecretKey: "ADMINPASSWORD"

postgresql:
  enabled: false

externalDatabase:
  host: "postgres-postgresql"
  port: 5432
  user: "keycloak_db"
  database: "keycloak_db"
  existingSecret: "keycloak-secrets"
  existingSecretPasswordKey: "DBPASSWORD"

proxyHeaders: xforwarded