# Let's Encrypt STAGING issuer — ezzel teszteld előbb a teljes flow-t, mert
# a staging CA-nak gyakorlatilag nincs rate limitje, csak a böngésző nem
# fogja megbízhatónak jelölni a tanúsítványt (öntesztre jó, nem élesre).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: mackmarton@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
