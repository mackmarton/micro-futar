# Let's Encrypt PROD issuer — csak akkor váltsunk erre (a Certificate
# issuerRef.name mezőjében), ha a staginggel már végigment egyszer a
# challenge sikeresen. A prod CA-nak van rate limitje (50 cert/domain/hét).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mackmarton@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
