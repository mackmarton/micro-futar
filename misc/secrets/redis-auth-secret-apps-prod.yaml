# Ugyanaz a Vault-bejegyzés, mint a redis-auth-secret.yaml, de a
# micro-futar-apps-prod namespace-be materializálva is — a Kubernetes
# Secretek nem érhetők el namespace-ek között, az api_gateway pod itt fut.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth-secret
  namespace: micro-futar-apps-prod
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: redis-auth-secret
    creationPolicy: Owner
  data:
  - secretKey: REDIS_PASSWORD # Ez lesz a kulcs a K8s Secretben
    remoteRef:
      key: redis-auth-secret # A Vault-beli útvonal
      property: REDIS_PASSWORD # A Vault-beli kulcs
