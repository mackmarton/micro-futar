apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  namespace: micro-futar-services-prod
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  data:
  - secretKey: DBPASSWORD # Ez lesz a kulcs a K8s Secretben
    remoteRef:
      key: keycloak-secrets # A Vault-beli útvonal
      property: DBPASSWORD # A Vault-beli kulcs
  - secretKey: ADMINPASSWORD # Ez lesz a kulcs a K8s Secretben
    remoteRef:
      key: keycloak-secrets # A Vault-beli útvonal
      property: ADMINPASSWORD # A Vault-beli kulcs
