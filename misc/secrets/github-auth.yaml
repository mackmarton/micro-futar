apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-auth
  namespace: micro-futar-apps-prod
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: github-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .docker_server }}": {
                "username": "{{ .docker_username }}",
                "password": "{{ .docker_password }}",
                "auth": "{{ printf "%s:%s" .docker_username .docker_password | b64enc }}"
              }
            }
          }
  data:
  - secretKey: docker_password
    remoteRef:
      key: ghcr-login-secret
      property: docker-password
  - secretKey: docker_server
    remoteRef:
      key: ghcr-login-secret
      property: docker-server
  - secretKey: docker_username
    remoteRef:
      key: ghcr-login-secret
      property: docker-username
