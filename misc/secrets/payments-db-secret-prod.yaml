apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-db-secret-prod
  namespace: micro-futar-apps-prod
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: payments-db-secret-prod
    creationPolicy: Owner
  data:
  - secretKey: password 
    remoteRef:
      key: payments-db-secret-prod
      property: password
