apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-stripe-secret-dev
  namespace: micro-futar-apps-dev
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: payments-stripe-secret-dev
    creationPolicy: Owner
  data:
  - secretKey: STRIPE_SECRET_KEY 
    remoteRef:
      key: payments-stripe-secret-dev
      property: secret-key
  - secretKey: STRIPE_WEBHOOK_SECRET
    remoteRef:
      key: payments-stripe-secret-dev
      property: webhook-secret
