apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-db-secret-dev
  namespace: micro-futar-apps-dev
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: payments-db-secret-dev
    creationPolicy: Owner
  data:
  - secretKey: PASSWORD
    remoteRef:
      key: payments-db-secret-dev
      property: password