apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-stripe-secret-prod
  namespace: micro-futar-apps-prod
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: payments-stripe-secret-prod
    creationPolicy: Owner
  data:
  - secretKey: STRIPE_SECRET_KEY
    remoteRef:
      key: payments-stripe-secret-prod 
      property: secret-key
  - secretKey: STRIPE_WEBHOOK_SECRET
    remoteRef:
      key: payments-stripe-secret-prod
      property: webhook-secret
