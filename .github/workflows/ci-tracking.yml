name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'tracking/**'
      - 'shared/**'
      - '.github/workflows/ci-tracking.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'tracking/**'
      - 'shared/**'
      - '.github/workflows/ci-tracking.yml'

concurrency:
  group: ci-tracking-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests for tracking project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          shared/pom.xml
          tracking/pom.xml

    - name: Build and install shared module
      run: mvn clean install -DskipTests --batch-mode --errors --fail-at-end --show-version
      working-directory: shared

    - name: Run tests for tracking module
      run: mvn clean test --batch-mode --errors --fail-at-end --show-version
      working-directory: tracking

    - name: Publish Test Results
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: always()
      continue-on-error: true
      with:
        name: Test Results
        path: tracking/target/surefire-reports/TEST-*.xml
        reporter: java-junit
        fail-on-error: false

    - name: Upload test reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      continue-on-error: true
      with:
        name: test-reports
        path: tracking/target/surefire-reports/
        retention-days: 30
  
  build-and-push-image:
    name: Build and push tracking project image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./tracking/Dockerfile
          push: true
          cache-from: type=gha,scope=tracking
          cache-to: type=gha,scope=tracking,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/tracking:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tracking:latest