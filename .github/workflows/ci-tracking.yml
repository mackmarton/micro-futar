name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'tracking/**'
      - 'shared/**'
      - '.github/workflows/ci-tracking.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'tracking/**'
      - 'shared/**'
      - '.github/workflows/ci-tracking.yml'

concurrency:
  group: ci-tracking-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests for tracking project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up JDK 25
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          shared/pom.xml
          tracking/pom.xml

    - name: Build and install shared module
      run: mvn clean install -DskipTests --batch-mode --errors --fail-at-end --show-version
      working-directory: shared

    - name: Run tests for tracking module
      run: mvn clean test --batch-mode --errors --fail-at-end --show-version
      working-directory: tracking

    - name: Publish Test Results
      uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
      if: always()
      continue-on-error: true
      with:
        name: Test Results
        path: tracking/target/surefire-reports/TEST-*.xml
        reporter: java-junit
        fail-on-error: false

    - name: Upload test reports
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      continue-on-error: true
      with:
        name: test-reports
        path: tracking/target/surefire-reports/
        retention-days: 30
  
  build-and-push-image:
    name: Build and push tracking project image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./tracking/Dockerfile
          push: true
          cache-from: type=gha,scope=tracking
          cache-to: type=gha,scope=tracking,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/tracking:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tracking:latest