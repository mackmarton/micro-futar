name: E2E

# Builds and runs the whole stack, so it is too slow for every push: nightly, or on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSE_PROJECT_NAME: micro-futar-e2e

jobs:
  e2e:
    name: Playwright against the docker compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Maven builds (Keycloak theme, Java services) fail now and then while downloading from Maven Central, hence
      # the three attempts. A retry reuses the layers that already succeeded.
      - name: Build Keycloak image
        id: keycloak-1
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with: &keycloak-build
          source: .
          files: docker-compose.yml
          targets: keycloak
          load: true
          set: |
            keycloak.cache-from=type=gha,scope=e2e-keycloak
            keycloak.cache-to=type=gha,scope=e2e-keycloak,mode=max

      - name: Build Keycloak image (second attempt)
        id: keycloak-2
        if: steps.keycloak-1.outcome == 'failure'
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with: *keycloak-build

      - name: Build Keycloak image (third attempt)
        if: steps.keycloak-2.outcome == 'failure'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with: *keycloak-build

      - name: Build application images
        id: apps-1
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with: &apps-build
          source: .
          files: docker-compose.yml
          targets: orders,logistics,courier,tracking,payments,api_gateway,client-ui,logistics-ui,courier-ui
          load: true
          set: |
            orders.cache-from=type=gha,scope=e2e-orders
            orders.cache-to=type=gha,scope=e2e-orders,mode=max
            logistics.cache-from=type=gha,scope=e2e-logistics
            logistics.cache-to=type=gha,scope=e2e-logistics,mode=max
            courier.cache-from=type=gha,scope=e2e-courier
            courier.cache-to=type=gha,scope=e2e-courier,mode=max
            tracking.cache-from=type=gha,scope=e2e-tracking
            tracking.cache-to=type=gha,scope=e2e-tracking,mode=max
            payments.cache-from=type=gha,scope=e2e-payments
            payments.cache-to=type=gha,scope=e2e-payments,mode=max
            api_gateway.cache-from=type=gha,scope=e2e-api-gateway
            api_gateway.cache-to=type=gha,scope=e2e-api-gateway,mode=max
            client-ui.cache-from=type=gha,scope=e2e-client-ui
            client-ui.cache-to=type=gha,scope=e2e-client-ui,mode=max
            logistics-ui.cache-from=type=gha,scope=e2e-logistics-ui
            logistics-ui.cache-to=type=gha,scope=e2e-logistics-ui,mode=max
            courier-ui.cache-from=type=gha,scope=e2e-courier-ui
            courier-ui.cache-to=type=gha,scope=e2e-courier-ui,mode=max

      - name: Build application images (second attempt)
        id: apps-2
        if: steps.apps-1.outcome == 'failure'
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with: *apps-build

      - name: Build application images (third attempt)
        if: steps.apps-2.outcome == 'failure'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with: *apps-build

      # The browser and the containers use the same Keycloak address, see e2e/README.md.
      - name: Add the keycloak host name
        run: echo "127.0.0.1 keycloak" | sudo tee -a /etc/hosts

      - name: Start the stack and wait until everything is healthy
        run: docker compose --profile apps up -d --no-build --wait --wait-timeout 600

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Type check the tests
        run: npm run typecheck
        working-directory: e2e

      - name: Seed the master data
        run: node e2e/scripts/seed.mjs

      - name: Run Playwright tests
        run: npm test
        working-directory: e2e

      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p container-logs
          for service in $(docker compose --profile apps config --services); do
            docker compose --profile apps logs --no-color --timestamps "$service" > "container-logs/$service.log" 2>&1 || true
          done
          docker compose --profile apps ps -a > container-logs/ps.txt 2>&1 || true

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-logs
          path: container-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the stack and delete its volumes
        if: always()
        run: docker compose --profile apps down -v
