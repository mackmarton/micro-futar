name: SonarQube
on:
  push:
    branches: [ main ]
    paths:
      - 'api_gateway/**'
      - 'shared/**'
      - '.github/workflows/sonar-api-gateway.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'api_gateway/**'
      - 'shared/**'
      - '.github/workflows/sonar-api-gateway.yml'
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            shared/pom.xml
            api_gateway/pom.xml
      - name: Build and install shared module
        run: mvn clean install -DskipTests --batch-mode --errors --fail-at-end --show-version
        working-directory: shared
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=micro-futar-api-gateway
        working-directory: api_gateway
