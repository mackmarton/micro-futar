name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'ui/apps/keycloak-theme/**'
      - 'ui/packages/**'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - '.github/workflows/ci-keycloak-theme.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'ui/apps/keycloak-theme/**'
      - 'ui/packages/**'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - '.github/workflows/ci-keycloak-theme.yml'

concurrency:
  group: ci-keycloak-theme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build keycloak-theme
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build keycloak theme
      run: npm run build-keycloak-theme --workspace=apps/keycloak-theme

  build-and-push-image:
    name: Build and push keycloak project image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./ui
          file: ./ui/apps/keycloak-theme/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/keycloak:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/keycloak:latest
