name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'ui/apps/client-ui/**'
      - 'ui/packages/**'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - '.github/workflows/ci-client-ui.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'ui/apps/client-ui/**'
      - 'ui/packages/**'
      - 'ui/package.json'
      - 'ui/package-lock.json'
      - '.github/workflows/ci-client-ui.yml'

concurrency:
  group: ci-client-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint and build client-ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint client-ui
      run: npm run lint --workspace=apps/client-ui

    - name: Build client-ui
      run: npm run build --workspace=apps/client-ui

  build-and-push-image:
    name: Build and push client-ui project image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ui
          file: ./ui/apps/client-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/client-ui:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/client-ui:latest
