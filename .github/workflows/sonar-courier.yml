name: SonarQube
on:
  push:
    branches: [ main ]
    paths:
      - 'courier/**'
      - 'shared/**'
      - '.github/workflows/sonar-courier.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'courier/**'
      - 'shared/**'
      - '.github/workflows/sonar-courier.yml'
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            shared/pom.xml
            courier/pom.xml
      - name: Build and install shared module
        run: mvn clean install -DskipTests --batch-mode --errors --fail-at-end --show-version
        working-directory: shared
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=micro-futar-courier
        working-directory: courier
