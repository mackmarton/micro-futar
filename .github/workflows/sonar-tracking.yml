name: SonarQube
on:
  push:
    branches: [ main ]
    paths:
      - 'tracking/**'
      - '.github/workflows/ci-tracking.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tracking/**'
      - '.github/workflows/ci-tracking.yml'
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            shared/pom.xml
            tracking/pom.xml
      - name: Build and install shared module
        run: mvn clean install -DskipTests --batch-mode --errors --fail-at-end --show-version
        working-directory: shared
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=micro-futar-tracking
        working-directory: tracking
