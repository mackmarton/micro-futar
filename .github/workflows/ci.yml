name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'orders/**'
      - 'shared/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'orders/**'
      - 'shared/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          shared/pom.xml
          orders/pom.xml

    - name: Build and install shared module
      run: mvn clean install -DskipTests --batch-mode --errors --fail-at-end --show-version
      working-directory: shared

    - name: Run tests for orders module
      run: mvn clean test --batch-mode --errors --fail-at-end --show-version
      working-directory: orders

    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: orders/target/surefire-reports/TEST-*.xml
        reporter: java-junit
        fail-on-error: false

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: orders/target/surefire-reports/
        retention-days: 30
  
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./orders
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest