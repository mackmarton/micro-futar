name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'orders/**'
      - 'shared/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'orders/**'
      - 'shared/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          shared/pom.xml
          orders/pom.xml

    - name: Build and install shared module
      run: mvn clean install -DskipTests --batch-mode --errors --fail-at-end --show-version
      working-directory: shared

    - name: Run tests for orders module
      run: mvn clean test --batch-mode --errors --fail-at-end --show-version
      working-directory: orders

    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: orders/target/surefire-reports/TEST-*.xml
        reporter: java-junit
        fail-on-error: false

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: orders/target/surefire-reports/
        retention-days: 30

  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          shared/pom.xml
          orders/pom.xml

    - name: Build and install shared module
      run: mvn clean install -DskipTests --batch-mode
      working-directory: shared

    - name: Build orders module
      run: mvn clean package -DskipTests --batch-mode
      working-directory: orders

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: orders-jar
        path: orders/target/*.jar
        retention-days: 7
