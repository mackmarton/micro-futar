name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'payments/**'
      - '.github/workflows/ci-payments.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'payments/**'
      - '.github/workflows/ci-payments.yml'

jobs:
  test:
    name: Run Tests for payments project
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          shared/pom.xml
          payments/pom.xml

    - name: Build and install shared module
      run: mvn clean install -DskipTests --batch-mode --errors --fail-at-end --show-version
      working-directory: shared

    - name: Run tests for payments module
      run: mvn clean test --batch-mode --errors --fail-at-end --show-version
      working-directory: payments

    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      continue-on-error: true
      with:
        name: Test Results
        path: payments/target/surefire-reports/TEST-*.xml
        reporter: java-junit
        fail-on-error: false

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: test-reports
        path: payments/target/surefire-reports/
        retention-days: 30
  
  build-and-push-image:
    name: Build and push payments project image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./payments/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/payments:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/payments:latest