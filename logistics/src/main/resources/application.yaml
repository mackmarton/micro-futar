server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: logistics
  profiles:
    active: ${SPRING_PROFILE}
  jpa:
    generate-ddl: true
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL}/realms/micro-futar-realm/protocol/openid-connect/certs
          #issuer-uri: ${KEYCLOAK_ISSUER_URI}
jwt:
  auth:
    converter:
      resource-id: api-gateway-client
      principal-attribute: preferred_username
    # the iss claim carries the public Keycloak address, which differs from KEYCLOAK_URL
    expected-issuer: ${KEYCLOAK_ISSUER_URI}
    expected-audience: ${KEYCLOAK_EXPECTED_AUDIENCE:api-gateway-client}

open-route-service:
  api-key: ${OPEN_ROUTE_SERVICE_API_KEY}
  connect-timeout-ms: ${OPEN_ROUTE_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${OPEN_ROUTE_SERVICE_READ_TIMEOUT_MS:5000}
  # pause between two geocoding calls of the bulk run (ORS geocoding quota is per minute)
  geocode-delay-ms: ${OPEN_ROUTE_SERVICE_GEOCODE_DELAY_MS:700}
kafka:
  topics:
    location-region-topic: ${LOCATION_REGION_TOPIC}
    location-country-topic: ${LOCATION_COUNTRY_TOPIC}
    location-city-topic: ${LOCATION_CITY_TOPIC}
    country-price-topic: ${COUNTRY_PRICE_TOPIC}
    package-size-topic: ${PACKAGE_SIZE_TOPIC}
    shipment-topic: ${SHIPMENT_TOPIC}
    shipment-route-courier-topic: ${SHIPMENT_ROUTE_COURIER_TOPIC}
    shipment-route-fulfilled-topic: ${SHIPMENT_ROUTE_FULFILLED_TOPIC}
    assignment-status-topic: ${ASSIGNMENT_STATUS_TOPIC}
    depo-topic: ${DEPO_TOPIC}
    shipment-route-topic: ${SHIPMENT_ROUTE_TOPIC}
    courier-topic: ${COURIER_TOPIC}
    vehicle-topic: ${VEHICLE_TOPIC}
    currency-topic: ${CURRENCY_TOPIC}
    shipment-priced-topic: ${SHIPMENT_PRICED_TOPIC}

url:
  api-gateway: ${API_GATEWAY_URL}