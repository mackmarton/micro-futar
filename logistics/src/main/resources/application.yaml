server:
  port: ${SERVER_PORT}

spring:
  application:
    name: logistics
  profiles:
    active: ${SPRING_PROFILE}
  jpa:
    generate-ddl: false
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

open-route-service:
  api-key: ${OPEN_ROUTE_SERVICE_API_KEY}
kafka:
  topics:
    location-region-topic: ${LOCATION_REGION_TOPIC}
    location-country-topic: ${LOCATION_COUNTRY_TOPIC}
    location-city-topic: ${LOCATION_CITY_TOPIC}
    country-price-topic: ${COUNTRY_PRICE_TOPIC}
    package-size-topic: ${PACKAGE_SIZE_TOPIC}
    order-topic: ${ORDER_TOPIC}