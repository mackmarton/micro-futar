replicaCount: 3

image:
  repository: logistics
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: logistics.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: logistics-tls
      hosts:
        - logistics.yourdomain.com

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/actuator/prometheus"

config:
  serverPort: 8081
  springProfile: prod
  datasource:
    url: jdbc:postgresql://postgres-prod:5432/logistics_db
    username: logistics_db
    passwordSecretName: logistics-db-secret-prod
    passwordSecretKey: password
  kafka:
    bootstrapServers: kafka-prod-0:9092,kafka-prod-1:9092,kafka-prod-2:9092
  keycloak:
    url: https://auth.yourdomain.com
    issuer_uri: http://localhost:8090/auth/realms/logistics

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

kafka:
  topics:
    location_region_topic: location-regions
    location_country_topic: location-countries
    location_city_topic: location-cities
    country_price_topic: country-prices
    package_size_topic: package-sizes
    shipment_topic: shipments
    depo_topic: depos
    shipment_route_courier_topic: shipment-route-couriers
    shipment_route_topic: shipment-routes
    courier_topic: couriers
    vehicle_topic: vehicles