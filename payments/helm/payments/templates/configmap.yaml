apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payments.fullname" . }}-config
  labels:
    {{- include "payments.labels" . | nindent 4 }}
data:
  DATASOURCE_URL: {{ .Values.config.datasource.url | quote }}
  DATASOURCE_USERNAME: {{ .Values.config.datasource.username | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.kafka.bootstrapServers | quote }}
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  SPRING_PROFILE: {{ .Values.config.springProfile | quote }}
  KEYCLOAK_URL: {{ .Values.config.keycloak.url | quote }}
  CLIENT_UI_URL: {{ .Values.config.clientUiUrl | quote }}
  PAYMENT_REQUEST_TOPIC: {{ .Values.kafka.topics.payment_request_topic | quote }}
  PAYMENT_STATUS_TOPIC: {{ .Values.kafka.topics.payment_status_topic | quote }}
  SHIPMENT_PRICED_TOPIC: {{ .Values.kafka.topics.shipment_priced_topic | quote }}
