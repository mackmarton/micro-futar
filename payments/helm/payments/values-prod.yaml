replicaCount: 2

image:
  repository: ghcr.io/mackmarton/payments
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: github-auth

service:
  type: ClusterIP
  port: 8080
  targetPort: 8081

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/actuator/prometheus"

config:
  serverPort: 8081
  springProfile: prod
  datasource:
    url: jdbc:postgresql://postgres-postgresql.micro-futar-services-prod:5432/payments_db
    username: payments_db
    passwordSecretName: payments-db-secret-prod
    passwordSecretKey: password
  kafka:
    bootstrapServers: kafka.micro-futar-services-prod:9092
  stripe:
    # Secret with keys STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET
    secretName: payments-stripe-secret-prod
  # Stripe Checkout redirects the sender back here after paying or cancelling
  clientUiUrl: https://micro-futar.hu
  keycloak:
    url: https://auth.micro-futar.hu

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

kafka:
  topics:
    payment_request_topic: payment-requests
    payment_status_topic: payment-statuses
    shipment_priced_topic: shipment-priced
