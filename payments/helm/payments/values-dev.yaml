replicaCount: 1

image:
  repository: ghcr.io/mackmarton/payments
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: github-auth

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

autoscaling:
  enabled: false

config:
  serverPort: 8080
  springProfile: dev
  datasource:
    url: jdbc:postgresql://postgres-db-postgresql.micro-futar-services-dev:5432/payments_db
    username: payments_db
    passwordSecretName: payments-db-secret-dev
    passwordSecretKey: PASSWORD
  kafka:
    bootstrapServers: kafka-futar.micro-futar-services-dev:9092
  stripe:
    # Secret with keys STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET
    secretName: payments-stripe-secret-dev
  # Stripe Checkout redirects the sender back here after paying or cancelling
  clientUiUrl: http://localhost:8070
  keycloak:
    url: http://keycloak.micro-futar-services-dev:80/auth

kafka:
  topics:
    payment_request_topic: payment-requests
    payment_status_topic: payment-statuses
    shipment_priced_topic: shipment-priced
