replicaCount: 1

image:
  repository: payments
  pullPolicy: Never
  tag: "latest"

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

config:
  serverPort: 8081
  springProfile: local
  datasource:
    url: jdbc:postgresql://postgres-db-postgresql.micro-futar-services:5432/payments_db
    username: payments_db
    passwordSecretName: payments-db-secret
    passwordSecretKey: password
  kafka:
    bootstrapServers: kafka.micro-futar-services:9092
  stripe:
    # Secret with keys STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET
    secretName: payments-stripe-secret
  # Stripe Checkout redirects the sender back here after paying or cancelling
  clientUiUrl: http://localhost:5173
  keycloak:
    url: http://localhost:8090

kafka:
  topics:
    payment_request_topic: payment-requests
    payment_status_topic: payment-statuses
    shipment_priced_topic: shipment-priced
