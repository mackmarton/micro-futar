server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: payments
  profiles:
    active: ${SPRING_PROFILE}
  jpa:
    generate-ddl: true
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL}/realms/micro-futar-realm/protocol/openid-connect/certs
jwt:
  auth:
    converter:
      resource-id: api-gateway-client
      principal-attribute: preferred_username
kafka:
  topics:
    payment-request-topic: ${PAYMENT_REQUEST_TOPIC}
    payment-status-topic: ${PAYMENT_STATUS_TOPIC}
    shipment-priced-topic: ${SHIPMENT_PRICED_TOPIC}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

url:
  api-gateway: ${API_GATEWAY_URL:http://localhost:8085}
  client-ui: ${CLIENT_UI_URL:http://localhost:5173}
