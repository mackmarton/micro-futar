server:
  port: ${SERVER_PORT}

spring:
  application:
    name: courier
  profiles:
    active: ${SPRING_PROFILE}
  jpa:
    generate-ddl: true
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL}/realms/courier/protocol/openid-connect/certs
          #issuer-uri: ${KEYCLOAK_URL}/realms/courier
jwt:
  auth:
    converter:
      resource-id: courier-client
      principal-attribute: preferred_username

kafka:
  topics:
    package-size-topic: ${PACKAGE_SIZE_TOPIC}
    shipment-topic: ${SHIPMENT_TOPIC}
    shipment-route-courier-topic: ${SHIPMENT_ROUTE_COURIER_TOPIC}
    depo-topic: ${DEPO_TOPIC}
    shipment-route-topic: ${SHIPMENT_ROUTE_TOPIC}
    courier-topic: ${COURIER_TOPIC}
    vehicle-topic: ${VEHICLE_TOPIC}